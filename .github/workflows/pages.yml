# .github/workflows/pages.yml
#
# Deploy the User Manual to GitHub Pages.
#
# Assembles the site from docs/ (images, architecture docs) plus src/client/web/
# (help-and-user-manual.html, CSS, fonts) so there are no duplicate files in the repo.
# The help-and-user-manual.html CSS paths are rewritten from absolute (/style.css) to
# relative (style.css) since GitHub Pages serves under /lp-ranger/.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/client/web/help-and-user-manual.html"
      - "src/client/web/help.css"
      - "src/client/web/disclosure.html"
      - "src/client/web/screenshot-gallery.html"
      - "src/client/web/gallery.css"
      - "src/client/web/style.css"
      - "src/client/web/9mm-pos-mgr.css"
      - "src/client/web/fonts.css"
      - "src/client/web/fonts/**"
      - "docs/**"
      - ".github/workflows/pages.yml"

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Assembly itself lives in scripts/build-pages-site.js so the local
      # preview (npm run show-gallery) and this deploy share ONE
      # implementation and cannot drift. Only the two genuinely-CI steps
      # stay here: `npm ci` and `copy-fonts` populate src/client/web/fonts, which
      # the builder then copies. Running those locally would wipe and
      # reinstall node_modules, which is why the preview calls the builder
      # rather than reusing this step.
      - name: Assemble site
        run: |
          npm ci --ignore-scripts
          npm run copy-fonts
          node scripts/build-pages-site.js _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
