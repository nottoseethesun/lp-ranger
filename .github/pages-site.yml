# Declarative spec for the static GitHub Pages site.
#
# This file is the SINGLE SOURCE OF TRUTH for what gets published and how
# it is rewritten. Two callers read it, both through
# `scripts/build-pages-site.js`:
#
#   - .github/workflows/pages.yml  → assembles into _site/ and deploys
#   - npm run show-gallery         → assembles into tmp/gallery-preview/
#                                     and serves it locally
#
# Because both go through the same spec, a local preview cannot drift
# from what actually deploys. Add a page or an asset here and both pick
# it up; there is nowhere else to change.
#
# Why the rewrites exist: the pages reference their CSS absolutely and
# stamped (`/style.css?v=123`, from `npm run build`), which only resolves
# while the dashboard server is running. A static host needs each sheet
# relative, sitting next to the HTML, so its path is made relative and
# its stamp dropped.

# Stylesheets EVERY published page loads, made relative and unstamped.
sharedSheets:
  - style.css
  - 9mm-pos-mgr.css
  - fonts.css

# Scripts dropped from every published page, whatever stamp follows the
# path. The manual's asks the running app for the install's own figures;
# a static copy has no app to ask, and keeps the shipped figures the
# build wrote.
droppedScripts:
  - /dist/manual-figures.js

# Pages to publish. `css` names the page-specific stylesheet whose
# cache-busted href also needs flattening.
pages:
  - src: src/client/web/help-and-user-manual.html
    css: help.css
  - src: src/client/web/disclosure.html
    css: help.css
  - src: src/client/web/screenshot-gallery.html
    css: gallery.css

# Stylesheets and assets copied flat alongside the pages.
flatAssets:
  - src/client/web/style.css
  - src/client/web/9mm-pos-mgr.css
  - src/client/web/fonts.css
  - src/client/web/help.css
  - src/client/web/gallery.css
  - src/client/web/favicon.png

# Self-hosted fonts. Populated by `npm run copy-fonts`, which the deploy
# workflow runs; a missing directory degrades to fallback typefaces
# rather than failing the build.
fonts:
  from: src/client/web/fonts
  to: fonts
  extension: .woff2

# Directory trees copied wholesale. The gallery references images as
# `images/…`, which resolves next to the HTML — hence docs/images → images.
trees:
  - from: docs/images
    to: images
